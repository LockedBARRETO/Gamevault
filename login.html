<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - GameVault</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div class="logo">
            <h1>GameVault</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="estoque.html">Estoque</a>
            <a href="carrinho.html">Carrinho 🛒</a>
            <a href="login.html" id="link-login">Login</a>
        </nav>

    </header>


    <!-- Área de login -->
    <main>

        <section class="login-container">

            <div class="login-box">

                <h2>Entrar</h2>

                <p>
                    Entre na sua conta para continuar.
                </p>


                <form id="form-login">

                    <div class="campo">

                        <label for="usuario">
                            Usuário
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            placeholder="Digite seu usuário"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="botao-login"
                    >
                        Entrar
                    </button>

                </form>


                <p class="cadastro">
                    Ainda não possui uma conta?
                    <a href="#">Criar conta</a>
                </p>

            </div>

        </section>

    </main>


    <!-- Rodapé -->
    <footer>

        <p>
            &copy; 2026 GameVault - Todos os direitos reservados.
        </p>

    </footer>

    <script src="JS/script.js"></script>
</body>

</html>
