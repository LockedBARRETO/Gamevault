<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento - GameVault</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div class="logo">
            <h1>GameVault</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="estoque.html">Estoque</a>
            <a href="carrinho.html">Carrinho 🛒</a>
            <a href="login.html" id="link-login">Login</a>
        </nav>

    </header>


    <!-- Conteúdo principal -->
    <main>

        <section class="pagina-pagamento">

            <h2>Finalizar Pedido</h2>

            <!-- Formulário de entrega e pagamento -->
            <div class="dados-pedido">

                <form id="form-pagamento">

                    <h3>Endereço de entrega</h3>

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>

                    <div class="linha-campos">

                        <div class="campo">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000" required>
                        </div>

                        <div class="campo">
                            <label for="numero">Número</label>
                            <input type="text" id="numero" name="numero" placeholder="Nº" required>
                        </div>

                    </div>

                    <div class="campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" name="rua" placeholder="Digite o nome da rua" required>
                    </div>

                    <div class="campo">
                        <label for="complemento">Complemento (opcional)</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto, bloco, referência...">
                    </div>

                    <div class="linha-campos">

                        <div class="campo">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro" placeholder="Digite o bairro" required>
                        </div>

                        <div class="campo">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade" required>
                        </div>

                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado" required>
                            <option value="">Selecione</option>
                            <option value="AC">AC</option>
                            <option value="AL">AL</option>
                            <option value="AP">AP</option>
                            <option value="AM">AM</option>
                            <option value="BA">BA</option>
                            <option value="CE">CE</option>
                            <option value="DF">DF</option>
                            <option value="ES">ES</option>
                            <option value="GO">GO</option>
                            <option value="MA">MA</option>
                            <option value="MT">MT</option>
                            <option value="MS">MS</option>
                            <option value="MG">MG</option>
                            <option value="PA">PA</option>
                            <option value="PB">PB</option>
                            <option value="PR">PR</option>
                            <option value="PE">PE</option>
                            <option value="PI">PI</option>
                            <option value="RJ">RJ</option>
                            <option value="RN">RN</option>
                            <option value="RS">RS</option>
                            <option value="RO">RO</option>
                            <option value="RR">RR</option>
                            <option value="SC">SC</option>
                            <option value="SP">SP</option>
                            <option value="SE">SE</option>
                            <option value="TO">TO</option>
                        </select>
                    </div>

                    <h3>Forma de pagamento</h3>

                    <div class="opcoes-pagamento">

                        <label class="opcao-pagamento">
                            <input type="radio" name="pagamento" value="cartao" checked>
                            Cartão na entrega
                        </label>

                        <label class="opcao-pagamento">
                            <input type="radio" name="pagamento" value="dinheiro">
                            Dinheiro na entrega
                        </label>

                        <label class="opcao-pagamento">
                            <input type="radio" name="pagamento" value="pix">
                            Pix
                        </label>

                    </div>

                    <button type="submit" class="botao-confirmar">
                        Confirmar Pedido
                    </button>

                </form>

            </div>


            <!-- Resumo do pedido -->
            <aside class="resumo">

                <h2>Resumo do pedido</h2>

                <div class="itens-resumo-pagamento">
                </div>

                <hr>

                <p class="total">
                    Total:
                    <strong>R$ 0,00</strong>
                </p>

            </aside>

        </section>

    </main>


    <!-- Rodapé -->
    <footer>

        <p>
            &copy; 2026 GameVault - Todos os direitos reservados.
        </p>

    </footer>

    <script src="JS/script.js"></script>
</body>

</html>
