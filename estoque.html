<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque - GameVault</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div class="logo">
            <h1>GameVault</h1>
        </div>

        <nav>
            <a href="index.html">Início</a>
            <a href="estoque.html">Estoque</a>
            <a href="carrinho.html">Carrinho 🛒</a>
            <a href="login.html" id="link-login">Login</a>
        </nav>

    </header>


    <!-- Conteúdo principal -->
    <main>

       <div class="form-cadastro-jogo" id="form-cadastro-jogo" style="display: none;">

    <h3>Cadastrar novo jogo</h3>

    <form id="form-novo-jogo">

        <div class="linha-campos">

            <div class="campo">
                <label for="novo-nome">Nome</label>
                <input type="text" id="novo-nome" required>
            </div>

            <div class="campo">
                <label for="novo-genero">Gênero</label>
                <input type="text" id="novo-genero" required>
            </div>

        </div>

        <div class="linha-campos">

            <div class="campo">
                <label for="novo-preco">Preço (R$)</label>
                <input type="number" id="novo-preco" step="0.01" min="0" required>
            </div>

            <div class="campo">
                <label for="novo-estoque">Estoque inicial</label>
                <input type="number" id="novo-estoque" min="0" required>
            </div>

        </div>

        <div class="campo">
            <label for="novo-imagem">Caminho da imagem (ex: img/celeste.jpg)</label>
            <input type="text" id="novo-imagem" placeholder="img/nome-do-arquivo.jpg">
        </div>

        <button type="submit" class="botao-confirmar">
            Cadastrar jogo
        </button>

    </form>

</div>

        </section>

    </main>


    <!-- Rodapé -->
    <footer>

        <p>
            &copy; 2026 GameVault - Todos os direitos reservados.
        </p>

    </footer>

    <script src="JS/script.js"></script>
</body>

</html>
