<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho - GameVault</title>

    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>

        <div class="logo">
            <h1>GameVault</h1>
        </div>

        <nav>
            <a href="gamevault.html">Início</a>
            <a href="estoque.html">Estoque</a>
            <a href="carrinho.html">Carrinho 🛒</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <!-- Conteúdo principal -->
    <main>

        <section class="pagina-carrinho">

            <h2>Meu Carrinho</h2>

            <div class="itens-carrinho">

                <!-- Item 1 -->
                <article class="item-carrinho">

                    <img
                        src="img/minecraft.jpg"
                        alt="Capa do Minecraft"
                    >

                    <div class="informacoes-item">

                        <h3>Minecraft</h3>

                        <p>R$ 89,90</p>

                        <div class="quantidade">

                            <button>-</button>

                            <span>1</span>

                            <button>+</button>

                        </div>

                    </div>

                    <button class="remover">
                        Remover
                    </button>

                </article>


                <!-- Item 2 -->
                <article class="item-carrinho">

                    <img
                        src="img/terraria.jpg"
                        alt="Capa do Terraria"
                    >

                    <div class="informacoes-item">

                        <h3>Terraria</h3>

                        <p>R$ 19,90</p>

                        <div class="quantidade">

                            <button>-</button>

                            <span>1</span>

                            <button>+</button>

                        </div>

                    </div>

                    <button class="remover">
                        Remover
                    </button>

                </article>

            </div>


            <!-- Resumo da compra -->
            <aside class="resumo">

                <h2>Resumo da compra</h2>

                <p>
                    Subtotal:
                    <strong>R$ 109,80</strong>
                </p>

                <p>
                    Frete:
                    <strong>Grátis</strong>
                </p>

                <hr>

                <p class="total">
                    Total:
                    <strong>R$ 109,80</strong>
                </p>

                <button class="finalizar">
                    Finalizar compra
                </button>

            </aside>

        </section>

    </main>


    <!-- Rodapé -->
    <footer>

        <p>
            &copy; 2026 GameVault - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
